name: Sync Legal Entity Records

on:
  schedule:
    - cron: '37 18 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync official legal entity records
        id: download
        run: npm run sync:legal-entity-records

      - name: Record synchronization status
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.download.outcome }}
        run: |
          if [ "$SYNC_OUTCOME" = "success" ]; then
            echo "### Legal entity download and validation succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "Validated records are ready for the commit step." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Legal entity synchronization incomplete" >> "$GITHUB_STEP_SUMMARY"
            echo "Previous published records remain unchanged. See download_failed logs for source URL, progress, elapsed time and retry count." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit updated legal entity records
        run: |
          if git diff --quiet -- functions/api/synced-legal-entity-records.js; then
            echo "No legal entity record changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/synced-legal-entity-records.js
          git commit -m "chore: sync legal entity records"
          git push
